name: 🪟 Build Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.10.3

jobs:
  build_win:
    name: 🔨 Build (${{ matrix.arch }}, ${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: windows-2025
            compiler: mingw
            qt_host: windows
            qt_arch: win64_mingw
            qt_dir: mingw_64
          - arch: aarch64
            runner: windows-11-arm
            compiler: msvc
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            qt_dir: msvc2022_arm64
            vcpkg_triplet: arm64-windows
            cmake_arch: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 📦 Install Qt
        shell: pwsh
        run: |
          pip install aqtinstall
          python -m aqt install-qt -O "${{ github.workspace }}/Qt" ${{ matrix.qt_host }} desktop ${{ env.QT_VERSION }} ${{ matrix.qt_arch }}
          "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}/bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 📦 Install MinGW
        if: matrix.compiler == 'mingw'
        shell: pwsh
        run: |
          python -m aqt install-tool -O "${{ github.workspace }}/Qt" windows desktop tools_mingw1310
          "${{ github.workspace }}/Qt/Tools/mingw1310_64/bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 📦 Install OpenCV (MinGW)
        if: matrix.compiler == 'mingw'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/FastTrackOrg/Windows_MinGW_64_OpenCV/releases/download/4.10.0/OpenCV_MinGW_64.zip" `
            -OutFile OpenCV_MinGW_64.zip
          Expand-Archive OpenCV_MinGW_64.zip -DestinationPath "${{ github.workspace }}"
      - name: 📦 Install OpenCV (MSVC)
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          vcpkg install "opencv4[ffmpeg]:${{ matrix.vcpkg_triplet }}"
      - name: 🔨 Build FastTrack (MinGW)
        if: matrix.compiler == 'mingw'
        shell: pwsh
        run: |
          $qtRoot = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}"
          cmake -S . -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DSKIP_TEST=ON
          cmake --build build

          New-Item -ItemType Directory -Force build/FastTrack
          Copy-Item build/bin/fasttrack.exe build/FastTrack/FastTrack.exe
          Copy-Item src/assets/icon.ico build/FastTrack
          & "$qtRoot/bin/windeployqt.exe" build/FastTrack/FastTrack.exe --no-translations
          Get-ChildItem "${{ github.workspace }}/Qt/Tools/mingw1310_64/bin" -Filter "lib*.dll" |
            Copy-Item -Destination build/FastTrack
          Copy-Item OpenCV_MinGW_64/bin/opencv_videoio_ffmpeg4100_64.dll build/FastTrack
          Copy-Item OpenCV_MinGW_64/bin/libopencv_world4100.dll build/FastTrack
      - name: 🔨 Build FastTrack (MSVC)
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $qtRoot = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}"
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" `
            -DSKIP_TEST=ON
          cmake --build build --config Release

          New-Item -ItemType Directory -Force build/FastTrack
          Copy-Item build/bin/Release/fasttrack.exe build/FastTrack/FastTrack.exe
          Copy-Item src/assets/icon.ico build/FastTrack
          & "$qtRoot/bin/windeployqt.exe" build/FastTrack/FastTrack.exe --no-translations

          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg_triplet }}/bin"
          Get-ChildItem $vcpkgBin -Filter *.dll | Copy-Item -Destination build/FastTrack
          $opencvTools = "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg_triplet }}/tools/opencv4"
          if (Test-Path $opencvTools) {
            Get-ChildItem $opencvTools -Recurse -Filter *.dll |
              Copy-Item -Destination build/FastTrack
          }
          # /openmp:llvm uses Visual Studio's LLVM OpenMP runtime, which is
          # not part of the vcpkg or Qt deployment sets.
          $archFolder = if ("${{ matrix.cmake_arch }}" -eq "ARM64") {
            "arm64"
          } else {
            "x64"
          }
          $ompNames = if ("${{ matrix.cmake_arch }}" -eq "ARM64") {
            @("libomp140.aarch64.dll", "libomp.aarch64.dll", "libomp.dll", "libomp140.dll")
          } else {
            @("libomp140.x86_64.dll", "libomp.x86_64.dll", "libomp.dll", "libomp140.dll")
          }
          $searchRoots = @()
          if ($env:VCINSTALLDIR) {
            $searchRoots += Split-Path (Split-Path $env:VCINSTALLDIR -Parent) -Parent
          }
          if ($env:VCToolsInstallDir) {
            $searchRoots += Split-Path (Split-Path (Split-Path $env:VCToolsInstallDir -Parent) -Parent) -Parent
          }
          $vsBase = Join-Path $env:ProgramFiles "Microsoft Visual Studio"
          if (Test-Path $vsBase) {
            $searchRoots += Get-ChildItem $vsBase -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          }
          $searchRoots = $searchRoots | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $ompRuntime = $null
          foreach ($root in $searchRoots) {
            $preferredDirs = @(
              (Join-Path $root "VC\Redist\MSVC"),
              (Join-Path $root "VC\Tools\Llvm"),
              (Join-Path $root "VC\Tools\MSVC")
            )
            foreach ($dir in $preferredDirs) {
              if (-not (Test-Path $dir)) {
                continue
              }
              $candidate = Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -in $ompNames -and (
                    $_.FullName -match [regex]::Escape("\$archFolder\") -or
                    $_.FullName -match "OpenMP\.LLVM"
                  )
                } |
                Select-Object -First 1
              if ($candidate) {
                $ompRuntime = $candidate
                break
              }
            }
            if ($ompRuntime) {
              break
            }
          }
          if (-not $ompRuntime) {
            throw "Could not locate the LLVM OpenMP runtime (libomp*.dll)."
          }
          Copy-Item $ompRuntime.FullName -Destination build/FastTrack
      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastTrack-windows-${{ matrix.arch }}
          path: build/FastTrack

  test_bundle:
    name: 🧪 Test bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: windows-2025
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    needs: build_win
    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: FastTrack-windows-${{ matrix.arch }}
          path: FastTrack

      - name: 🧪 Run CLI smoke test
        run: |
          cd FastTrack
          ./FastTrack.exe --cli --help

      - name: 🖥️ Run GUI smoke test
        shell: pwsh
        run: |
          cd FastTrack

          $p = Start-Process -FilePath ".\FastTrack.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          if ($p.HasExited) {
            Write-Host "GUI startup smoke test failed: app exited early with code $($p.ExitCode)."
            exit $p.ExitCode
          }

          Write-Host "GUI startup smoke test passed: app stayed alive for 10 seconds."
          Stop-Process -Id $p.Id -Force

      - name: 🚀 Publish continuous release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Set-Location FastTrack
          $assetName = "FastTrack-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path .\* -DestinationPath $assetName -Force

          gh release view continuous -R $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create continuous `
              -R $env:GH_REPO `
              --title "continuous" `
              --notes "Rolling build artifacts." `
              --prerelease `
              --latest=false
            if ($LASTEXITCODE -ne 0) {
              gh release view continuous -R $env:GH_REPO *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to create or access release 'continuous'."
              }
            }
          }

          gh release upload continuous $assetName --clobber -R $env:GH_REPO
